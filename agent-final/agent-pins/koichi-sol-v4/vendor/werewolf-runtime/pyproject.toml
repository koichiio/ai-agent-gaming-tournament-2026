[project]
name = "werewolf-runtime"
version = "0.1.0"
description = "Neutral Werewolf transport, adapter protocol, supervision, and audit records"
requires-python = ">=3.14"
dependencies = ["httpx>=0.28,<1", "python-dotenv>=1.1,<2"]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
