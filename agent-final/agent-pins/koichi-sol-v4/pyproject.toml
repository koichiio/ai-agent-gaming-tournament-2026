[project]
name = "agent-koichi"
version = "0.1.0"
description = "Exact-belief Werewolf agent for the UCLA AltruAgent tournament"
readme = "README.md"
authors = [
    { name = "Koichi Nakayamada", email = "k@koichi.io" }
]
requires-python = ">=3.14"
dependencies = ["httpx>=0.28,<1", "python-dotenv>=1.1,<2", "werewolf-runtime", "final-providers"]

[tool.uv.sources]
werewolf-runtime = { path = "vendor/werewolf-runtime", editable = false }
final-providers = { path = "vendor/final-providers", editable = false }

[dependency-groups]
dev = ["pytest>=8,<10"]

[project.scripts]
agent-koichi = "agent_koichi.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
